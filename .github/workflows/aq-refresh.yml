name: Refresh air quality (hourly)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest air quality values (EEA)
        run: node scripts/fetch-aq.mjs

      - name: Fetch citizen sensors subset (Sensor.Community)
        run: node scripts/fetch-sc.mjs

      - name: Fetch current outages (ViK ArcGIS / Toplofikatsia / ERM Zapad)
        run: |
          node scripts/fetch-vik.mjs || echo "ViK fetch failed — keeping previous"
          node scripts/fetch-toplo.mjs || echo "Toplo fetch failed — keeping previous"
          node scripts/fetch-erm.mjs || echo "ERM fetch failed — keeping previous"

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
